    const INITIAL_FLASHCARDS = [

    // --- THREE.JS 3D CANVAS COMPONENT ---
    const ThreeCanvas = ({ activeCategory }) => {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 18;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        let colorHex = 0x00f2fe;
        if (activeCategory === 'medical') colorHex = 0x10b981;
        if (activeCategory === 'civil_services') colorHex = 0xfbbf24;
        if (activeCategory === 'management') colorHex = 0xe100ff;
        if (activeCategory === 'law') colorHex = 0x3b82f6;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(colorHex, 2, 50);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // Particle Stars
        const particleCount = 180;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i++) {
          positions[i] = (Math.random() - 0.5) * 40;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMaterial = new THREE.PointsMaterial({ color: colorHex, size: 0.15, transparent: true, opacity: 0.7 });
        const particles = new THREE.Points(geometry, particleMaterial);
        scene.add(particles);

        // 3D Polyhedron Mesh
        const mainGroup = new THREE.Group();
        const icoGeo = new THREE.IcosahedronGeometry(4, 1);
        const icoMat = new THREE.MeshStandardMaterial({ color: colorHex, wireframe: true });
        const icoMesh = new THREE.Mesh(icoGeo, icoMat);
        mainGroup.add(icoMesh);
        mainGroup.position.set(7, 0, -2);
        scene.add(mainGroup);

        let mouseX = 0, mouseY = 0;
        const handleMouseMove = (e) => {
          mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
          mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        };
        window.addEventListener('mousemove', handleMouseMove);

        let animId;
        const animate = () => {
          animId = requestAnimationFrame(animate);
          mainGroup.rotation.x += 0.005;
          mainGroup.rotation.y += 0.008;
          particles.rotation.y += 0.0005;
          camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
          camera.position.y += (-mouseY * 2 - camera.position.y) * 0.05;
          camera.lookAt(scene.position);
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('mousemove', handleMouseMove);
          if (container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
          renderer.dispose();
        };
      }, [activeCategory]);

      return <div ref={mountRef} className="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-75" />;
    };

            correct += 1;

                <button

                  className="hidden sm:flex items-center space-x-2 px-3.5 py-1.5 rounded-2xl glass-panel border border-cyan-500/30 text-cyan-300 text-xs font-bold hover:scale-105 transition-all"
                >
                  <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping" />
                  <span>{currentExam.name}</span>
                  <span>▼</span>
                </button>
              </div>

              {/* NAV TABS */}
              <nav className="hidden lg:flex items-center space-x-1">
                {[
                  { id: 'hero', label: 'Overview' },
                  { id: 'notes', label: 'Notes Vault' },
                  { id: 'flashcards', label: '3D Flashcards' },
                  { id: 'tests', label: 'Test Arena' },

            {activeView === 'hero' && (
              <div className="max-w-7xl mx-auto px-4 py-12 space-y-12">
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">

                      ⚡ Updated 2026 Entrance Syllabus
                    </span>
                    <h1 className="text-4xl sm:text-6xl font-black text-white tracking-tight leading-tight">
                      Master Competitive Exams with <span className="text-gradient-cyan">3D Visual Learning</span>
                    </h1>
                    <p className="text-base text-slate-300">
                      Prepare for <span className="text-cyan-300 font-bold">{currentExam.name}</span> and 20+ top entrance exams with interactive high-yield notes, spatial 3D flashcards, realistic test simulators, and live performance tracking.
                    </p>
                    <div className="flex flex-wrap gap-4 pt-2">
                      <button onClick={() => setActiveView('tests')} className="px-7 py-4 rounded-2xl bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-950 font-extrabold text-sm shadow-xl shadow-cyan-500/30 hover:scale-105 transition-all">
                        Start Mock Test →
                      </button>
                      <button onClick={() => setActiveView('flashcards')} className="px-7 py-4 rounded-2xl glass-panel border border-white/20 text-white font-bold text-sm hover:bg-white/10 transition-all">
                        3D Flashcards Deck
                      </button>
                    </div>
                  </div>

                  <div className="lg:col-span-5 p-8 rounded-3xl glass-card border border-cyan-500/30 space-y-6 shadow-2xl">
                    <div className="flex justify-between items-center border-b border-white/10 pb-4">
                      <div>
                        <h3 className="text-lg font-bold text-white">{currentExam.name}</h3>
                        <p className="text-xs text-slate-400">{currentExam.targetLabel}</p>
                      </div>
                      <span className="px-3 py-1 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300">Active</span>
                    </div>
                    <div className="grid grid-cols-2 gap-4 text-xs">
                      <div className="p-3 rounded-2xl bg-white/5">
                        <span className="block text-slate-400">Duration</span>
                        <span className="font-bold text-white text-sm">{currentExam.durationMinutes} Mins</span>
                      </div>
                      <div className="p-3 rounded-2xl bg-white/5">
                        <span className="block text-slate-400">Marking</span>
                        <span className="font-bold text-cyan-300">{currentExam.markingScheme}</span>
                      </div>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {currentExam.subjects.map((s, idx) => (
                        <span key={idx} className="px-3 py-1 rounded-xl bg-cyan-500/10 text-cyan-300 text-xs font-semibold">
                          {s}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 2. NOTES VAULT */}
            {activeView === 'notes' && (
              <div className="max-w-7xl mx-auto px-4 py-8 space-y-6">
                <h2 className="text-3xl font-black text-white">Syllabus Notes & Formula Vault</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {examFilteredNotes.map(n => (
                    <div key={n.id} onClick={() => setSelectedNote(n)} className="p-6 rounded-3xl glass-card cursor-pointer border border-white/10 hover:border-cyan-500/40 space-y-3">
                      <span className="px-2.5 py-1 rounded text-[10px] font-bold bg-cyan-500/20 text-cyan-300 uppercase">{n.subject}</span>
                      <h3 className="text-lg font-bold text-white">{n.title}</h3>
                      <p className="text-xs text-slate-300 line-clamp-3">{n.summary}</p>
                      <span className="text-xs text-cyan-400 font-bold block pt-2">Read Note →</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 3. 3D FLASHCARDS */}
            {activeView === 'flashcards' && (
              <div className="max-w-4xl mx-auto px-4 py-8 space-y-6">
                <h2 className="text-3xl font-black text-white text-center">3D Spatial Flashcards Deck</h2>
                {currentCard ? (
                  <div className="space-y-6">
                    <div className="w-full h-80 perspective-1000">
                      <div onClick={() => setIsFlipped(!isFlipped)} className={`relative w-full h-full cursor-pointer transition-transform duration-700 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                        {/* FRONT */}
                        <div className="absolute inset-0 rounded-3xl glass-card border-2 border-purple-500/30 p-8 flex flex-col justify-between backface-hidden bg-slate-900/90 shadow-2xl">
                          <span className="text-xs font-bold text-purple-300 uppercase">Question (Tap to flip 🔄)</span>
                          <h3 className="text-xl font-bold text-white text-center">{currentCard.front}</h3>
                          <span className="text-xs text-slate-400 text-center">Card {fcIndex + 1} of {examFilteredCards.length}</span>
                        </div>
                        {/* BACK */}
                        <div className="absolute inset-0 rounded-3xl glass-card border-2 border-cyan-500/40 p-8 flex flex-col justify-between rotate-y-180 backface-hidden bg-slate-950/95 shadow-2xl">
                          <span className="text-xs font-bold text-cyan-300 uppercase">Answer ✅</span>
                          <p className="text-base font-semibold text-slate-100 text-center whitespace-pre-line">{currentCard.back}</p>
                          <span className="text-xs text-cyan-400 text-center font-bold">Spatial memory recall active</span>
                        </div>
                      </div>
                    </div>
                    <div className="flex justify-center space-x-4">
                      <button onClick={() => { setIsFlipped(false); setFcIndex((fcIndex - 1 + examFilteredCards.length) % examFilteredCards.length); }} className="px-6 py-3 rounded-2xl glass-panel text-white font-bold text-xs">
                        ← Previous
                      </button>
                      <button onClick={() => { setIsFlipped(false); setFcIndex((fcIndex + 1) % examFilteredCards.length); }} className="px-6 py-3 rounded-2xl bg-purple-500 text-white font-bold text-xs">
                        Next Card →
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="p-8 text-center text-slate-400">No flashcards for this exam yet.</div>
                )}
              </div>
            )}

            {/* 4. TEST ARENA */}
            {activeView === 'tests' && (
              <div className="max-w-4xl mx-auto px-4 py-8 space-y-6">
                {testState === 'idle' && (
                  <div className="p-8 rounded-3xl glass-card border border-emerald-500/30 text-center space-y-6">
                    <h2 className="text-3xl font-black text-white">{activeTest.title}</h2>
                    <p className="text-xs text-slate-400">Simulate actual exam conditions with negative marking ({currentExam.markingScheme}).</p>
                    <button onClick={() => setTestState('running')} className="px-8 py-4 rounded-2xl bg-emerald-500 text-slate-950 font-black text-sm shadow-lg shadow-emerald-500/20">
                      Begin Mock Test Now
                    </button>
                  </div>
                )}

                {testState === 'running' && (
                  <div className="p-8 rounded-3xl glass-card border border-white/10 space-y-6">
                    <h3 className="text-xl font-bold text-white">{activeTest.questions[0].question}</h3>
                    <div className="space-y-3">
                      {activeTest.questions[0].options.map((opt, idx) => (
                        <div
                          key={idx}
                          onClick={() => setUserAnswers({ ...userAnswers, [activeTest.questions[0].id]: idx })}
                          className={`p-4 rounded-2xl border cursor-pointer ${
                            userAnswers[activeTest.questions[0].id] === idx ? 'border-emerald-400 bg-emerald-950/40 text-emerald-200' : 'border-white/10 bg-white/5'
                          }`}
                        >
                          {opt}
                        </div>
                      ))}
                    </div>
                    <button onClick={handleFinishTest} className="w-full py-3 rounded-xl bg-emerald-500 text-slate-950 font-bold">
                      Submit Test & Calculate Score
                    </button>
                  </div>
                )}

                {testState === 'submitted' && lastResult && (
                  <div className="p-8 rounded-3xl glass-card border border-cyan-500/30 text-center space-y-6">
                    <h2 className="text-3xl font-black text-white">Scorecard: {lastResult.score} Marks</h2>
                    <p className="text-sm text-cyan-300 font-bold">Accuracy: {lastResult.accuracy}%</p>
                    <button onClick={() => setTestState('idle')} className="px-6 py-3 rounded-xl bg-cyan-500 text-slate-950 font-bold">
                      Retake Test
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* 5. ANALYTICS */}
            {activeView === 'analytics' && (
              <div className="max-w-5xl mx-auto px-4 py-8 space-y-6">
                <h2 className="text-3xl font-black text-white">Performance Records</h2>
                <div className="grid grid-cols-3 gap-4">
                  <div className="p-6 rounded-3xl glass-card border border-amber-500/30 text-center">
                    <span className="text-xs text-slate-400 font-bold">Total Attempts</span>
                    <h3 className="text-3xl font-black text-white mt-1">{testHistory.length}</h3>
                  </div>
                  <div className="p-6 rounded-3xl glass-card border border-cyan-500/30 text-center">
                    <span className="text-xs text-slate-400 font-bold">Accuracy</span>
                    <h3 className="text-3xl font-black text-cyan-400 mt-1">88%</h3>
                  </div>
                  <div className="p-6 rounded-3xl glass-card border border-emerald-500/30 text-center">
                    <span className="text-xs text-slate-400 font-bold">Target Readiness</span>
                    <h3 className="text-3xl font-black text-emerald-400 mt-1">High</h3>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* EXAM SELECTOR MODAL */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="w-full max-w-3xl rounded-3xl glass-panel border border-cyan-500/30 p-6 space-y-6">
                <div className="flex justify-between items-center border-b border-white/10 pb-4">
                  <h3 className="text-xl font-bold text-white">Select Target Entrance Exam</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400">✕</button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-96 overflow-y-auto">
                  {EXAM_CATEGORIES.flatMap(c => c.exams).map(e => (
                    <div
                      key={e.id}
                      onClick={() => { setCurrentExamId(e.id); setIsModalOpen(false); }}
                      className={`p-4 rounded-2xl cursor-pointer border ${
                        currentExamId === e.id ? 'border-cyan-400 bg-cyan-950/40 text-cyan-300' : 'border-white/10 bg-white/5 hover:border-white/20'
                      }`}
                    >
                      <h4 className="font-bold text-white">{e.name}</h4>
                      <p className="text-xs text-slate-400">{e.fullName}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
